<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8B Ödevleri | MuhamMath</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #d97706;
      --accent-soft: #fffbeb;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #fbbf24;
        --accent-soft: #451a03;
        --border: #334155;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.6;
    }
    .kart {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .ust-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .rozet {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .tarih {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .baslik {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 18px 0 10px;
      color: var(--accent);
    }
    .alt-baslik {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 14px 0 8px;
    }
    .paragraf {
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .madde {
      margin: 6px 0 6px 12px;
      font-size: 1rem;
    }
    .link-grubu {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 14px;
    }
    .link-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid var(--border);
    }
    .link-btn:hover {
      opacity: 0.85;
    }
    .bos-mesaj {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="kart">
    <div class="ust-bar">
      <span class="rozet">📚 8B Sınıfı Ödevleri</span>
      <span class="tarih">Son Güncelleme: 24.11.2026 17:22</span>
    </div>
    <div class="icerik">
        <p class="paragraf">8B</p>
    </div>
  </div>
</body>
</html>
