<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5A Sınıfı Ödevleri</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 16px;
      line-height: 1.6;
    }
    .kapsayici {
      max-width: 800px;
      margin: 0 auto;
    }
    .ust {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .ust h1 {
      margin: 0;
      font-size: 1.35rem;
      color: #1d4ed8;
    }
    .tarih {
      font-size: 0.85rem;
      color: #64748b;
    }
    h2 {
      font-size: 1.1rem;
      color: #0f172a;
      margin: 18px 0 8px;
    }
    .kart {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #2563eb;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .kart p {
      margin: 0;
    }
    .linkler {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .linkler a {
      font-size: 0.85rem;
      color: #2563eb;
      text-decoration: none;
      background: #eff6ff;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .linkler a:hover {
      text-decoration: underline;
    }
    .bos {
      color: #64748b;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="kapsayici">
    <div class="ust">
      <h1>5A Sınıfı Ödevleri</h1>
      <span class="tarih">Son güncelleme: 24.11.2026 17:22</span>
    </div>
    <div class="kart"><p>5 A</p></div>
  </div>
</body>
</html>
